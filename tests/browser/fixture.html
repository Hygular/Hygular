<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hygular browser tests</title>
    <link rel="stylesheet" href="/dist/css/hygular.min.css" />
    <style>
      body {
        margin: 0;
        min-height: 200vh;
      }
      #content {
        margin: 0 24px;
      }
      .fixed {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
      }
      .sticky {
        position: sticky;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div class="sticky" data-sticky-lock><div id="sticky">Sticky</div></div>
    <main id="content">
      <input id="select" type="hidden" aria-label="Number" />
      <div id="responsive" class="is-hidden md:is-block">Responsive</div>
    </main>
    <div class="fixed" data-fixed-lock><div id="fixed">Fixed</div></div>
    <script type="module">
      import * as api from "/dist/js/hygular.esm.js";
      window.api = api;
    </script>
  </body>
</html>
